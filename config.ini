# 炉石一键修复 - 路径配置（可选）
# ------------------------------------------------------------------
# 一般不用改。脚本会自动从注册表、常见安装位置里探测以下路径。
# 只有自动探测失败（日志里显示"未找到"）时，才取消下面某一行的注释并填写真实路径。
# 等号左边不要改；右边写完整路径。

# 战网客户端主程序
#BattleNetExe=D:\Battle.net\Battle.net.exe

# 炉石传说主程序
#GameExe=D:\Hearthstone\Hearthstone.exe

# 炉石传说盒子
#BoxExe=C:\Program Files (x86)\炉石传说盒子\HSAng.exe

# 炉石日志目录（一般不用填，默认取游戏目录下的 Logs）
#LogRoot=D:\Hearthstone\Logs

# 战网里炉石的产品 ID，国服默认 WTCG；只有点击兜底时才会用到
GameUid=WTCG
GameUidAlt=hs_beta
